@if (isLoggedIn) {
<div class="layout">

    <!-- MAIN CONTENT -->
    <div class="main">

        <!-- TOPBAR -->
        <header class="topbar">

            <!-- PAGE TITLE (left) -->
            <div class="page-title">
                <span class="page-title-icon">
                    <svg viewBox="0 0 24 24" width="22" height="22"
                        fill="currentColor" aria-hidden="true">
                        <path
                            d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" />
                    </svg>
                </span>
                <span class="page-title-text">Vendor Management</span>
            </div>

            <!-- USER MENU (right, unchanged) -->
            <div class="user-menu">

                <button
                    class="avatar-btn"
                    (click)="toggleUserMenu($event)"
                    aria-haspopup="true"
                    [attr.aria-expanded]="userMenuOpen"
                    aria-label="User account">

                    <mat-icon>account_circle</mat-icon>

                </button>

                @if (userMenuOpen) {
                <div class="dropdown">

                    <div class="dropdown-user">
                        {{ userName }}
                    </div>

                    <button
                        class="dropdown-item"
                        (click)="logout()">

                        <svg viewBox="0 0 24 24"
                            width="20"
                            height="20"
                            fill="currentColor">

                            <path
                                d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" />

                        </svg>

                        <span>Logout</span>

                    </button>

                </div>
                }

            </div>

        </header>

        <!-- PAGE CONTENT -->
        <main class="content">
            <router-outlet></router-outlet>
        </main>

    </div>

</div>
}

@else {

<div style="padding: 40px; text-align: center;">

    <h2>Please login first</h2>

    <p>
        You need to login to access the vendor portal.
    </p>

    <a routerLink="/login">
        Go to Login
    </a>

</div>

}
